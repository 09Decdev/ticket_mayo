server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API backend (global prefix "ticket-mayo" trong Nest) — giữ nguyên path khi proxy
    location /ticket-mayo/ {
        proxy_pass http://ticket-mayo-api:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://ticket-mayo-api:3020/health;
    }

    # SPA router của React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
